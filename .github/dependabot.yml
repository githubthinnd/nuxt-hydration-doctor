version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      development-dependencies:
        dependency-type: development
    ignore:
      # @nuxt/module-builder peers on typescript ^5.9; revisit when it supports 6
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # keep the Node typings at the oldest Node the dev toolchain supports (22)
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
